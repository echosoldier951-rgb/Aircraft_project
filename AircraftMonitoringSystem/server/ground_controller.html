<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ground Controller - Aircraft Flight Data</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Ground - Aircraft Flight Data</h1>

  <form id="flightForm" class="flight-request">
    <label for="flightNumber">Flight Number</label>
    <input id="flightNumber" name="flight_number" type="text" placeholder="AB1234" required>
    <button id="getFlightBtn" type="submit">Get Flight</button>
  </form>

  <table id="flightTable">
    <thead>
      <tr>
        <th>Field</th>
        <th>Value</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="3" class="status">Enter a flight number, then select Get Flight.</td>
      </tr>
    </tbody>
  </table>

  <button id="saveBtn" class="save-btn" style="display: none;">Save Changes</button>

  <script>
    const tableBody = document.querySelector('#flightTable tbody');
    const flightForm = document.getElementById('flightForm');
    const flightNumberInput = document.getElementById('flightNumber');
    const saveBtn = document.getElementById('saveBtn');

    let currentFlightData = {};

    function renderMessage(message) {
      tableBody.innerHTML = '';
      saveBtn.style.display = 'none';

      const row = document.createElement('tr');
      const cell = document.createElement('td');

      cell.colSpan = 3;
      cell.className = 'status';
      cell.textContent = message;

      row.appendChild(cell);
      tableBody.appendChild(row);
    }

    function renderRows(data) {
      tableBody.innerHTML = '';
      currentFlightData = data;

      if (!data || typeof data !== 'object' || Array.isArray(data)) {
        renderMessage('No data available.');
        return;
      }

      Object.entries(data).forEach(([key, value]) => {
        const row = document.createElement('tr');

        const keyCell = document.createElement('td');
        const valueCell = document.createElement('td');
        const actionCell = document.createElement('td');

        keyCell.textContent = key;
        valueCell.textContent = value;

        const editButton = document.createElement('button');
        editButton.textContent = 'Edit';
        editButton.type = 'button';
        editButton.className = 'edit-btn';

        editButton.addEventListener('click', () => {
          const input = document.createElement('input');
          input.className = 'edit-input';
          input.value = valueCell.textContent;

          valueCell.innerHTML = '';
          valueCell.appendChild(input);
          input.focus();
        });

        actionCell.appendChild(editButton);

        row.appendChild(keyCell);
        row.appendChild(valueCell);
        row.appendChild(actionCell);

        tableBody.appendChild(row);
      });

      saveBtn.style.display = 'block';
    }

    async function loadFlightData(flightNumber) {
      try {
        renderMessage('Loading...');

        const params = new URLSearchParams({ flight_number: flightNumber });
        const response = await fetch(`/flight?${params.toString()}`);

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || 'Unable to load flight data.');
        }

        const data = await response.json();
        renderRows(data);
      } catch (error) {
        renderMessage(error.message);
      }
    }

    async function saveFlightData() {
      try {
        const updatedData = {};

        document.querySelectorAll('#flightTable tbody tr').forEach((row) => {
          const cells = row.querySelectorAll('td');

          if (cells.length < 2) {
            return;
          }

          const key = cells[0].textContent;
          const input = cells[1].querySelector('input');
          const value = input ? input.value.trim() : cells[1].textContent.trim();

          updatedData[key] = value;
        });

        const response = await fetch('/updateFlightInfo', {
    method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(updatedData)
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || 'Unable to save flight data.');
        }

        const savedData = await response.json();
        renderRows(savedData);
        alert('Flight data saved successfully.');
      } catch (error) {
        renderMessage(error.message);
      }
    }

    flightForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const flightNumber = flightNumberInput.value.trim();

      if (!flightNumber) {
        renderMessage('Enter a flight number first.');
        return;
      }

      loadFlightData(flightNumber);
    });

    saveBtn.addEventListener('click', saveFlightData);
  </script>
</body>
</html>
