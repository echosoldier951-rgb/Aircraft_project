<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events - Aircraft Flight Data</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>In-Flight Events Data</h1>

  <table id="eventsTable">
    <thead>
      <tr>
        <th>Flight Number</th>
        <th>Autopilot Status</th>
        <th>Cabin Pressure</th>
        <th>WiFi Usage</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="4" class="status">Loading...</td>
      </tr>
    </tbody>
  </table>

  <script>
    const tableBody = document.querySelector('#eventsTable tbody');

    // Renders list of events into the table
    function renderRows(events) {
      tableBody.innerHTML = '';

      if (!events || !Array.isArray(events) || events.length === 0) {
        renderMessage('No events available.');
        return;
      }

      events.forEach(event => {
        const row = document.createElement('tr');

        const flightCell = document.createElement('td');
        const autopilotCell = document.createElement('td');
        const pressureCell = document.createElement('td');
        const wifiCell = document.createElement('td');

        flightCell.textContent = event['Flight Number'] || 'N/A';
        
        const autopilotStatus = event['Autopilot Status'] || 'N/A';
        autopilotCell.textContent = autopilotStatus;
        // Highlight active status matching original styling convention
        if (autopilotStatus.toUpperCase() === 'ON') {
          autopilotCell.className = 'status';
        }

        pressureCell.textContent = event['Cabin Pressure'] !== undefined ? `${parseFloat(event['Cabin Pressure']).toFixed(2)} psi` : 'N/A';
        wifiCell.textContent = event['WiFi Usage'] !== undefined ? `${event['WiFi Usage']} Users` : 'N/A';

        row.appendChild(flightCell);
        row.appendChild(autopilotCell);
        row.appendChild(pressureCell);
        row.appendChild(wifiCell);

        tableBody.appendChild(row);
      });
    }

    // Displays helper message inside table row
    function renderMessage(message) {
      tableBody.innerHTML = '';
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = 4;
      cell.className = 'status';
      cell.textContent = message;
      row.appendChild(cell);
      tableBody.appendChild(row);
    }

    // Fetches in-flight events from the server
    async function loadEventsData() {
      try {
        // Dynamically point to the Flask server at port 5000 if served from a different origin (e.g. Live Server on port 5500)
        const serverUrl = window.location.port === '5000' ? '/events' : 'http://127.0.0.1:5000/events';

        const response = await fetch(serverUrl);
        if (!response.ok) {
          throw new Error(`Unable to load events data from database. Status: ${response.status}`);
        }
        const data = await response.json();
        renderRows(data);
      } catch (error) {
        renderMessage(error.message);
      }
    }

    // Initial load plus 5-second polling for real-time refresh.
    loadEventsData();
    setInterval(loadEventsData, 5000);
  </script>
</body>
</html>
